[project]
name = "student-assignment-tracker"
version = "0.1.0"
description = "IT 545 object-oriented Python assignment tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi[standard]>=0.115,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assignment_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
